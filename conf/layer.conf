# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-octavo-osd62"
BBFILE_PATTERN_meta-octavo-osd62 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-octavo-osd62 = "6"

LAYERDEPENDS_meta-octavo-osd62 = "core"
LAYERSERIES_COMPAT_meta-octavo-osd62 = "scarthgap"
